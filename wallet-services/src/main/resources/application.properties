spring.application.name=wallet-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5433/wallet_db
spring.datasource.username=wallet_user
spring.datasource.password=${WALLET_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The wallet only ever CHECKS tokens, so it gets the public key and nothing else.
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:file:../keys/public.pem}

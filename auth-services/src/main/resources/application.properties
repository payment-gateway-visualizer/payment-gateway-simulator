spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/auth_db
spring.datasource.username=auth_user
spring.datasource.password=${AUTH_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Secret used to sign tokens. Read from the environment so it never goes to Git.
app.jwt.secret=${JWT_SECRET}
# First admin account. Created on startup if it doesn't exist. Read from the environment.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}